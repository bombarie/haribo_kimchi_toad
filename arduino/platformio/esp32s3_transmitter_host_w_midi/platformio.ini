[seeed_xiao_esp32s3]
; platform = espressif32
platform = https://github.com/platformio/platform-espressif32/archive/refs/tags/v6.12.0.zip
board = seeed_xiao_esp32s3
framework = arduino
upload_protocol = esptool
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = 
	-<.git/>
	-<.svn/>
	+<*.h>
	+<${PIOENV}.cpp>
; AMAZING that this works -> this is needed to make the board appear as a
; USB device when you plug it in, and then be able to upload code to it 
; without needing to press the reset button at the right time.
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
board_upload.before_reset = default_reset
board_upload.after_reset = hard_reset

[lib_deps]
lib_deps = 

[lib_deps_midi]
lib_deps = 
	adafruit/Adafruit TinyUSB Library@3.3.4
	fortyseveneffects/MIDI Library@^5.0.2

; src for these flags: https://community.platformio.org/t/esp32-s3-tinyusb-config-not-working/34209/12
[midi_build_flags]
build_unflags = -DARDUINO_USB_MODE=1
build_flags = 
	-DUSE_TINYUSB=1
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	'-DCFG_TUSB_CONFIG_FILE="/Users/adriaanwormgoor/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32s3/include/arduino_tinyusb/include/tusb_config.h"'
lib_archive = no

[env:blinky_test]
extends = lib_deps, seeed_xiao_esp32s3

[env:ledc_pwm_out_test]
extends = lib_deps, seeed_xiao_esp32s3

[env:midihost_v01]
extends = lib_deps, lib_deps_midi, midi_build_flags, seeed_xiao_esp32s3

[env:midihost_v02_drive_pwm_out]
extends = lib_deps, lib_deps_midi, midi_build_flags, seeed_xiao_esp32s3

[env:midihost_v03_noods_protocol]
extends = lib_deps, lib_deps_midi, midi_build_flags, seeed_xiao_esp32s3

